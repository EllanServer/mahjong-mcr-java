plugins {
    id 'java-library'
}

group = 'top.ellan.mahjong.rules'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

repositories {
    def ruleSdkRepo = providers.gradleProperty('mahjongRuleSdkRepo')
    if (ruleSdkRepo.isPresent()) {
        maven {
            url = uri(ruleSdkRepo.get())
        }
    }
    mavenCentral()
}

dependencies {
    compileOnly 'top.ellan.mahjong:mahjong-rule-spi:1.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'top.ellan.mahjong:mahjong-rule-spi:1.1.0'
    testImplementation 'top.ellan.mahjong:mahjong-rule-tck:1.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events = [
            org.gradle.api.tasks.testing.logging.TestLogEvent.FAILED,
            org.gradle.api.tasks.testing.logging.TestLogEvent.SKIPPED
        ] as Set
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('microBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free MCR evaluator microbenchmark.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.ellan.mahjong.rules.mcr.benchmark.McrMicroBenchmark'
}

tasks.named('jar', Jar) {
    archiveBaseName = 'mcr-rule-pack'
    manifest {
        attributes(
            'Mahjong-Rule-Id': 'mcr',
            'Mahjong-Rule-Version': project.version,
            'Mahjong-SPI-Version': '1.1.0',
            'Mahjong-State-Schema': '1'
        )
    }
}

tasks.register('verifyRulePackJar') {
    group = 'verification'
    description = 'Checks the ServiceLoader entry and parent-loaded SPI boundary.'
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def names = []
        zipTree(archive).visit { details ->
            if (!details.directory) {
                names.add(details.relativePath.pathString)
            }
        }
        if (names.any { name -> name.startsWith('top/ellan/mahjong/spi/') }) {
            throw new GradleException('Rule pack jar must not bundle mahjong-rule-spi classes')
        }
        if (!names.contains('META-INF/services/top.ellan.mahjong.spi.RulePackProvider')) {
            throw new GradleException('Rule pack jar has no RulePackProvider service descriptor')
        }
        if (!names.contains('META-INF/mahjong-rule-pack.properties')
            || !names.contains('assets/mcr/tile-visuals.properties')) {
            throw new GradleException('Rule pack jar is missing its static descriptor resources')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRulePackJar')
}
